name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # To add a course later, turn this into a matrix and give each app its own base path.
    # The output of each app lives in apps/<app>/out. See docs/DEPLOY.md for the two hosting
    # options (one Pages site with sub-paths, or one repo's Pages per app).
    #
    # strategy:
    #   matrix:
    #     include:
    #       - app: english   # base path defaults to the repo name below
    #       - app: arabic
    #         basePath: /arabic-ladder
    #       - app: mandarin
    #         basePath: /mandarin-ladder
    #       - app: japanese
    #         basePath: /japanese-ladder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run content:check
      - name: Build static site (apps/english)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SHOW_DRAFTS: 'true'
      - run: touch apps/english/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/english/out

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build without base path for e2e
        run: npm run build
        env:
          NEXT_PUBLIC_SHOW_DRAFTS: 'true'
      - run: npm run test:e2e
        env:
          CI: 'true'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # English Ladder deploys to this repo's Pages (below). Arabic Ladder deploys to its own repo's
    # Pages (deploy-arabic). See docs/DEPLOY.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Root scripts run every app: English (with the engine's tests) and Arabic.
      - run: npm run lint
      - run: npm run test
      - run: npm run content:check
      - name: Build static site (apps/english)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SHOW_DRAFTS: 'true'
      - run: touch apps/english/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/english/out

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build without base path for e2e
        run: npm run build && npm run build:arabic
        env:
          NEXT_PUBLIC_SHOW_DRAFTS: 'true'
      - run: npm run test:e2e
        env:
          CI: 'true'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Arabic Ladder stays at https://andifathulms.github.io/arabic-ladder/: build apps/arabic with
  # that base path and push apps/arabic/out to the gh-pages branch of andifathulms/arabic-ladder.
  # Needs the ARABIC_PAGES_DEPLOY_KEY secret (docs/DEPLOY.md).
  deploy-arabic:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: pages-arabic
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site (apps/arabic)
        run: npm run build:arabic
        env:
          NEXT_PUBLIC_BASE_PATH: /arabic-ladder
          NEXT_PUBLIC_SHOW_DRAFTS: 'true'
      - run: touch apps/arabic/out/.nojekyll
      - name: Push to arabic-ladder gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ARABIC_PAGES_DEPLOY_KEY }}
          external_repository: andifathulms/arabic-ladder
          publish_branch: gh-pages
          publish_dir: apps/arabic/out
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: Arabic Ladder from ${{ github.repository }}@${{ github.sha }}'

  - { es: leche, id: susu, pos: noun, gender: f }
  - { es: pan, id: roti, pos: noun, gender: m }
  - { es: cine, id: bioskop, pos: noun, gender: m }
  - { es: caminar, id: "berjalan kaki", pos: verb, verb: { group: ar } }

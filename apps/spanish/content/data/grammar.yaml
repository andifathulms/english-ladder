# Grammar points (CLAUDE.md §3.4): ids used by curriculum `inventory` and lesson `introduces`.
# Draft data for the teacher's review.
#
# - level: the PCIC level the point belongs to (Plan Curricular del Instituto Cervantes, Gramática and
#   Pronunciación inventories). `pcic` cites the inventory section. Only 9.1.1 (presente: regular
#   paradigm, ser, estar, haber, ir at A1; vowel and spelling irregularities at A2) was confirmed
#   online on 2026-10-28; the other section numbers are from the published inventory's chapter
#   order and are marked for the reviewer to check (docs/spanish/human-tasks.md H1).
# - where PCIC places a point later than this course teaches it, `note` says so. Those points are
#   taught as the textbooks do (PRD §4.1) and need the teacher's approval.
# - verbs: verbs whose present tense the point teaches (the lint allows their forms from here on).
# - forms: fixed chunks the point teaches before their grammar (quisiera, me llamo).
# - detect: what the lint looks for to tell this point is used (lib: course/lint.ts).

# ---------- Dasar (pronunciation and spelling; PCIC Pronunciación y prosodia, Ortografía) ----------
- { id: d-vowels, level: A1, pcic: "Pronunciación 1", desc: "Five vowels, as in Indonesian; words Indonesian already has" }
- { id: d-letters, level: A1, pcic: "Ortografía 1", desc: "h silent, j and g+e/i, ñ, ll/y, b = v" }
- { id: d-c-z, level: A1, pcic: "Ortografía 1", desc: "c and z: /s/ in Latin America, /θ/ in Spain; qu, gu, güe" }
- { id: d-r-rr, level: A1, pcic: "Pronunciación 1", desc: "r (one tap) and rr (a roll)" }
- { id: d-stress, level: A1, pcic: "Ortografía 3", desc: "Stress: aguda, llana, esdrújula and the written accent" }
- { id: d-reading, level: A1, pcic: "Pronunciación 1", desc: "Reading aloud with the spelling rules" }


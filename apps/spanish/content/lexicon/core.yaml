# Function words a rung may use without a glossary entry (CLAUDE.md §4.1): articles, pronouns,
# prepositions, conjunctions, question words, numbers, greetings. Content words come from the rung's
# word list (content/data/words/<rung>.yaml) and lesson glossaries. Verb forms are checked by the
# inventory lint, not listed here. Later rungs inherit earlier rungs' words.
rungs:
  dasar:

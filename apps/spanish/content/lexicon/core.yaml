    - [yo, tú, él, ella, usted, nosotros, nosotras, vosotros, vosotras, ellos, ellas, ustedes]
    - [me, te, se]
    - [mi, mis, tu, tus, su, sus, nuestro, nuestra, nuestros, nuestras, vuestro, vuestra]
    - [a, sin, para, sobre, debajo, detrás, delante, entre, desde, hasta, cerca, lejos]
    - [e, u, pero, porque, también, tampoco, muy, mucho, mucha, muchos, muchas, poco, poca, pocos, pocas, bien, mal, más, ya, solo]
    - [qué, quién, quiénes, dónde, adónde, cuándo, cómo, cuál, cuáles, cuánto, cuánta, cuántos, cuántas]
    - [aquí, allí, ahí, hoy, ahora, nada, algo]

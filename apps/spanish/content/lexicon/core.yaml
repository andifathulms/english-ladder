    - [que, le, les, nos, os, mí, ti, conmigo, contigo]
    - [este, esta, estos, estas, ese, esa, esos, esas, aquel, aquella, aquellos, aquellas, esto, eso, aquello]
    - [antes, después, primero, tarde, temprano, siempre, nunca, vez, veces, todos, todo, toda, todas, cada, otro, otra, otros, otras]

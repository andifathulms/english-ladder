    - [dieciséis, diecisiete, dieciocho, diecinueve, veinte, veintiuno, veintiún, veintidós, veintitrés, veinticuatro, veinticinco]
    - [veintiséis, veintisiete, veintiocho, veintinueve, treinta, cuarenta, cincuenta, sesenta, setenta, ochenta, noventa, cien, ciento]
    - [años, año]

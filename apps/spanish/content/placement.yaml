# Cek level (PRD §5.2): 24 items, six per section, no feedback. The learner starts at the first rung
# where a section is under 75% (course.config placement outcomes). Draft for the teacher's review.
# `from` names the lesson behind each item once the lessons exist (M7).
items:
  # ---------- Dasar: sounds and spelling ----------
  - { id: pl-d1, section: dasar, type: stress, word: "café", syllables: [ca, fe], stressed: 1, needsAccent: true, why: { id: "*Ca-FÉ*: tekanan di suku terakhir, dan katanya berakhir dengan vokal, jadi perlu aksen.", en: "*Ca-FÉ*: stress on the last syllable and a final vowel, so it needs an accent." } }
  - { id: pl-d2, section: dasar, type: stress, word: "casa", syllables: [ca, sa], stressed: 0, needsAccent: false, why: { id: "*CA-sa*: berakhir dengan vokal dan ditekan di suku kedua dari belakang, jadi tanpa aksen.", en: "*CA-sa*: a final vowel, stressed second to last, so no accent." } }
  - { id: pl-d3, section: dasar, type: stress, word: "árbol", syllables: [ar, bol], stressed: 0, needsAccent: true, why: { id: "*ÁR-bol*: berakhir dengan *l* tapi ditekan di depan, jadi perlu aksen.", en: "*ÁR-bol*: ends in *l* but is stressed first, so it needs an accent." } }
  - { id: pl-d4, section: dasar, type: listen, audio: "perro", options: [pero, perro], answer: perro, why: { id: "*rr* digetarkan panjang: *perro* (anjing). *R* tunggal hanya satu ketukan: *pero* (tetapi).", en: "*rr* is a long roll: *perro* (dog). A single *r* is one tap: *pero* (but)." } }
  - { id: pl-d5, section: dasar, type: choice, lang: id, prompt: "Huruf mana yang tidak pernah dibaca?", options: [h, j, ñ], answer: h, why: { id: "*H* selalu diam: *hola* terdengar seperti *ola*.", en: "*H* is always silent: *hola* sounds like *ola*." } }
  - { id: pl-d6, section: dasar, type: choice, lang: id, prompt: "Bagaimana *ñ* dibaca?", options: ["seperti ny dalam nyanyi", "seperti n biasa", "seperti ng dalam bunga"], answer: "seperti ny dalam nyanyi", why: { id: "*Ñ* dibaca *ny*: *España*, *mañana*.", en: "*Ñ* sounds like Indonesian *ny*: *España*, *mañana*." } }
  # ---------- Easy 1: ser, estar, gender and agreement, -ar verbs, hay, age ----------
  - { id: pl-e1-1, section: easy1, type: gap, cue: "Aku dari Indonesia.", prompt: "Yo ___ de Indonesia.", options: [soy, estoy], answer: soy, why: { id: "Asal memakai *ser*: *soy de…*", en: "Origin takes *ser*: *soy de…*" } }
  - { id: pl-e1-2, section: easy1, type: gap, cue: "Lucía sedang lelah.", prompt: "Lucía ___ cansada.", options: [es, está], answer: está, why: { id: "Keadaan sementara memakai *estar*.", en: "A passing state takes *estar*." } }
  - { id: pl-e1-3, section: easy1, type: agree, noun: { es: casas, gender: f, number: pl, id: rumah-rumah }, adj: blanco, definite: true, options: { article: [los, las], adjective: [blancos, blancas] }, answers: { article: las, adjective: blancas }, why: { id: "*Casa* feminin, di sini jamak: *las* dan *blancas*.", en: "*Casa* is feminine, here plural: *las* and *blancas*." } }
  - { id: pl-e1-4, section: easy1, type: conjugate, verb: hablar, tense: presente, persons: [yo, tu, el], answers: { yo: hablo, tu: hablas, el: habla }, why: { id: "Kata kerja *-ar*: *-o*, *-as*, *-a*.", en: "*-ar* verbs: *-o*, *-as*, *-a*." } }
  - { id: pl-e1-5, section: easy1, type: gap, cue: "Ada sebuah buku di atas meja.", prompt: "___ un libro sobre la mesa.", options: [Hay, Está, Es], answer: Hay, why: { id: "*Hay* untuk 'ada' sesuatu yang belum disebut.", en: "*Hay* for 'there is' something new to the conversation." } }
  - { id: pl-e1-6, section: easy1, type: gap, cue: "Umurku dua puluh tahun.", prompt: "Tengo veinte ___.", options: [años, días], answer: años, why: { id: "Umur memakai *tener*: *tengo veinte años*, bukan *soy*.", en: "Age takes *tener*: *tengo veinte años*, not *soy*." } }
  # ---------- Easy 2: stem changes, gustar, ir a, reflexives, time, comparisons ----------
  - { id: pl-e2-1, section: easy2, type: form, base: querer, target: { person: yo, tense: presente }, answer: quiero, why: { id: "*Querer* berubah *e → ie*: *quiero*.", en: "*Querer* changes *e → ie*: *quiero*." } }
  - { id: pl-e2-2, section: easy2, type: gap, cue: "Aku suka taco.", prompt: "Me ___ los tacos.", options: [gusta, gustan], answer: gustan, why: { id: "Yang disukai jamak, jadi *gustan*.", en: "What is liked is plural, so *gustan*." } }
  - { id: pl-e2-3, section: easy2, type: gap, cue: "Besok aku akan makan bersama keluargaku.", prompt: "Mañana ___ a comer con mi familia.", options: [voy, va, vas], answer: voy, why: { id: "*Ir a* + infinitif untuk rencana: *voy a comer*.", en: "*Ir a* + infinitive for plans: *voy a comer*." } }
  - { id: pl-e2-4, section: easy2, type: gap, cue: "Aku bangun jam tujuh.", prompt: "Yo me ___ a las siete.", options: [levanto, levanta], answer: levanto, why: { id: "*Me* dengan *yo*: *me levanto*.", en: "*Me* goes with *yo*: *me levanto*." } }
  - { id: pl-e2-5, section: easy2, type: gap, cue: "Jam setengah empat.", prompt: "Son las tres y ___.", options: [media, medio], answer: media, why: { id: "*Y media*: lewat setengah, feminin seperti *hora*.", en: "*Y media*: half past, feminine like *hora*." } }
  - { id: pl-e2-6, section: easy2, type: gap, cue: "Madrid lebih besar daripada Sevilla.", prompt: "Madrid es más grande ___ Sevilla.", options: [que, como], answer: que, why: { id: "*Más … que*: lebih … daripada.", en: "*Más … que*: more … than." } }
  # ---------- Easy 3: the past, pronouns, por/para, the future ----------
  - { id: pl-e3-1, section: easy3, type: gap, cue: "Kemarin aku makan di restoran.", prompt: "Ayer ___ en un restaurante.", options: [comí, como, comeré], answer: comí, why: { id: "*Ayer* + kejadian selesai: pretérito indefinido, *comí*.", en: "*Ayer* + a finished event: the preterite, *comí*." } }
  - { id: pl-e3-2, section: easy3, type: gap, cue: "Hari ini aku sudah bekerja banyak.", prompt: "Hoy ___ trabajado mucho.", options: [he, ha, hay], answer: he, why: { id: "Pretérito perfecto: *he* + participio.", en: "The present perfect: *he* + participle." } }
  - { id: pl-e3-3, section: easy3, type: gap, cue: "Bukunya? Sudah kubaca.", prompt: "¿El libro? Ya ___ leí.", options: [lo, la, le], answer: lo, why: { id: "*Libro* maskulin: kata gantinya *lo*, di depan kata kerja.", en: "*Libro* is masculine: *lo*, before the verb." } }
  - { id: pl-e3-4, section: easy3, type: gap, cue: "Hadiah ini untukmu.", prompt: "Este regalo es ___ ti.", options: [para, por], answer: para, why: { id: "Penerima memakai *para*.", en: "A recipient takes *para*." } }
  - { id: pl-e3-5, section: easy3, type: gap, cue: "Sekarang aku sedang memasak.", prompt: "Ahora estoy ___.", options: [cocinando, cocinado, cocinar], answer: cocinando, why: { id: "*Estar* + gerundio untuk yang sedang terjadi.", en: "*Estar* + gerund for what is happening now." } }
  - { id: pl-e3-6, section: easy3, type: gap, cue: "Tahun depan aku akan bepergian ke Meksiko.", prompt: "El año que viene ___ a México.", options: [viajaré, viajé, viajaba], answer: viajaré, why: { id: "Masa depan: *viajaré*.", en: "The future: *viajaré*." } }

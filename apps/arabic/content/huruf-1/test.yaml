    answer: "baṣaru"
    why: { id: "Lingkaran pipih tanpa titik adalah ص, *s* yang tebal.", en: "The flat loop with no dot is ص, a heavy *s*." }
  - id: h1-t-15
    from: huruf1-06-sin-syin-shad-dhad
    type: spell
    match: exact
    prompt: "Susun suku katanya: *sa-ba-bu*."
    letters: ["سَ", "بَ", "بُ"]
    distractors: ["شَ", "صَ"]
    answer: "سَبَبُ"
    why: { id: "Sebab itu *sababu*, dengan س tanpa titik.", en: "Reason is *sababu*, with dotless س." }
  - id: h1-t-16

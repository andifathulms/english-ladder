    answer: "riʾatu"
    why: { id: "ئ adalah hamzah di atas gigi ya: hentakan kecil, *ʾ*.", en: "ئ is hamza on a ya tooth: a small catch, *ʾ*." }
  - id: h1-t-27
    from: huruf1-12-empat-bentuk
    type: spell
    match: exact
    prompt: "Susun suku katanya: *sya-ja-ra-tu*."
    letters: ["شَ", "جَ", "رَ", "ةُ"]

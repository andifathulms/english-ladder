    match: exact
    ar: "عَرَبُ"
    options: ["ʿarabu", "gharabu", "ʿaraba"]
    answer: "ʿarabu"
    why: { id: "ع tanpa titik, dan huruf terakhir berdhammah.", en: "ع without a dot, and the last letter has dhammah." }
  - id: h1-t-17
    from: huruf1-07-tha-zha-ain-ghain
    type: choice
    match: exact
    prompt: "Mana yang dibaca *ẓa*?"
    options: ["ظَ", "طَ", "ضَ"]
    answer: "ظَ"
    why: { id: "ظ adalah ط dengan satu titik.", en: "ظ is ط with one dot." }
  - id: h1-t-18
    from: huruf1-07-tha-zha-ain-ghain

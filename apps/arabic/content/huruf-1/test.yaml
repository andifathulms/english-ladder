items:
  - id: h1-t-01
    from: huruf1-01-kamu-sudah-tahu
    type: choice
    match: exact
    prompt: "Kata pertama di satu baris tulisan Arab ada di sebelah mana?"
    options: ["kanan", "kiri"]
    answer: "kanan"
    why: { id: "Arab dibaca dari kanan ke kiri, jadi kata pertama ada di kanan.", en: "Arabic is read right to left, so the first word is on the right." }
  - id: h1-t-02
    from: huruf1-01-kamu-sudah-tahu
    type: choice
    match: exact
    prompt: "Vokal pendek yang ditulis di bawah huruf namanya apa?"
    options: ["kasrah", "fathah", "dhammah"]
    answer: "kasrah"
    why: { id: "Kasrah ada di bawah huruf dan dibaca *i*.", en: "Kasrah sits below the letter and is read *i*." }
  - id: h1-t-03
    from: huruf1-02-ba-ta-tsa
    type: read
    match: exact
    ar: "بُ"
    options: ["ba", "bi", "bu"]
    answer: "bu"
    why: { id: "Dhammah dibaca *u*: *bu*.", en: "Dhammah is read *u*: *bu*." }
  - id: h1-t-04
    from: huruf1-02-ba-ta-tsa
    type: choice
    match: exact
    prompt: "Mana yang dibaca *ti*?"
    options: ["تِ", "ثِ", "تَ"]
    answer: "تِ"
    why: { id: "Dua titik di atas adalah ت, dan kasrah dibaca *i*.", en: "Two dots above is ت, and kasrah is read *i*." }
  - id: h1-t-05
    from: huruf1-02-ba-ta-tsa
    type: listen
    match: exact
    audio: "ثَ"
    options: ["ثَ", "تَ", "بَ"]
    answer: "ثَ"
    why: { id: "Ujung lidah di antara gigi: *tsa*, huruf ث.", en: "Tongue tip between the teeth: *tha*, the letter ث." }
  - id: h1-t-06
    from: huruf1-03-nun-ya
    type: read
    match: exact
    ar: "يَثِبُ"
    options: ["yatsibu", "natsibu", "batsibu"]
    answer: "yatsibu"
    why: { id: "Dua titik di bawah gigi pertama: ي, dibaca *ya*.", en: "Two dots under the first tooth: ي, read *ya*." }
  - id: h1-t-07
    from: huruf1-03-nun-ya
    type: spell
    match: exact
    prompt: "Susun suku katanya: *na-ba-ta*."
    letters: ["نَ", "بَ", "تَ"]
    distractors: ["يَ", "ثَ"]
    answer: "نَبَتَ"
    why: { id: "Titik di atas (na), di bawah (ba), dua di atas (ta).", en: "Dot above (na), below (ba), two above (ta)." }
  - id: h1-t-08
    from: huruf1-04-jim-ha-kha
    type: choice
    match: exact
    prompt: "Huruf mana yang tidak bertitik?"
    options: ["ح", "ج", "خ"]
    answer: "ح"
    why: { id: "ح tanpa titik. ج titiknya di bawah, خ di atas.", en: "ح has no dot. ج has its dot below, خ above." }
  - id: h1-t-09
    from: huruf1-04-jim-ha-kha
    type: read
    match: exact
    ar: "نَجَحَ"
    options: ["najaḥa", "najakha", "nakhaja"]
    answer: "najaḥa"
    why: { id: "Titik di bawah lalu tanpa titik: ج lalu ح.", en: "A dot below, then no dot: ج then ح." }
  - id: h1-t-10
    from: huruf1-04-jim-ha-kha
    type: listen
    match: exact
    audio: "خُ"
    options: ["خُ", "حُ", "جُ"]
    answer: "خُ"
    why: { id: "Bunyinya serak, seperti *kh* di *akhir*: خ.", en: "It rasped, like *kh* in *akhir*: خ." }
  - id: h1-t-11

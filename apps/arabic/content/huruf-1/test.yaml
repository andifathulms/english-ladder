    why: { id: "Bentuk ه dengan dua titik di akhir kata adalah ta marbuthah.", en: "The ه shape with two dots at the end of a word is ta marbuta." }
  - id: h1-t-26
    from: huruf1-11-hamzah-ta-marbuthah

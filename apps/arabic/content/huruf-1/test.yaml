    type: choice
    match: exact
    prompt: "Mana yang termasuk enam huruf yang tidak menyambung ke kiri?"
    options: ["ر", "ج", "ب"]
    answer: "ر"
    why: { id: "ر termasuk ا د ذ ر ز و, yang tidak pernah menyambung ke huruf sesudahnya.", en: "ر is one of ا د ذ ر ز و, which never join to the next letter." }
  - id: h1-t-12
    from: huruf1-05-tidak-menyambung
    type: read
    match: exact

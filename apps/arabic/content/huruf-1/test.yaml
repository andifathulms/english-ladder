    type: read
    match: exact
    ar: "وَرَقُ"
    options: ["waraqu", "waraku", "warafu"]
    answer: "waraqu"
    why: { id: "Dua titik di atas: ق, dibaca *q*.", en: "Two dots above: ق, read *q*." }
  - id: h1-t-20
    from: huruf1-08-fa-qaf
    type: listen
    match: exact
    audio: "قَ"
    options: ["قَ", "فَ"]
    answer: "قَ"
    why: { id: "Bunyinya dalam dari pangkal lidah: ق.", en: "A deep sound from the back of the tongue: ق." }
  - id: h1-t-21
    from: huruf1-09-kaf-lam
    type: spell
    match: exact
    prompt: "Susun suku katanya: *la-ba-nu*."
    letters: ["لَ", "بَ", "نُ"]
    distractors: ["كَ", "يُ"]
    answer: "لَبَنُ"
    why: { id: "Susu itu *labanu*: لَ, بَ, نُ.", en: "Milk is *labanu*: لَ, بَ, نُ." }
  - id: h1-t-22
    from: huruf1-09-kaf-lam

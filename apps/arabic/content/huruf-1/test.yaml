    ar: "عَسَلُ"
    options: ["ʿasalu", "asalu", "ʿasala"]
    answer: "ʿasalu"
    why: { id: "Madu dimulai dengan ع, bukan alif.", en: "Honey starts with ع, not alif." }
  - id: h1-t-23
    from: huruf1-10-mim-ha
    type: read
    match: exact
    ar: "ذَهَبُ"
    options: ["dzahabu", "zahabu", "dzaḥabu"]
    answer: "dzahabu"
    why: { id: "ذ dibaca *dz*, dan ه adalah *h* ringan.", en: "ذ is read *dz*, and ه is a light *h*." }
  - id: h1-t-24
    from: huruf1-10-mim-ha
    type: spell
    match: exact
    prompt: "Susun suku katanya: *qa-la-mu*."
    letters: ["قَ", "لَ", "مُ"]

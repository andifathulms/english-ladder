- { ar: "صَبَاحٌ", pos: noun, gender: m, rung: easy-1 }
- { ar: "مَسَاءٌ", pos: noun, gender: m, rung: easy-1 }
- { ar: "خَيْرٌ", pos: noun, gender: m, rung: easy-1 }
- { ar: "نُورٌ", pos: noun, gender: m, rung: easy-1 }
- { ar: "حَالٌ", pos: noun, gender: m, rung: easy-1 }
- { ar: "حَمْدٌ", pos: noun, gender: m, rung: easy-1 }
- { ar: "لِلّٰهِ", pos: chunk, rung: easy-1 }
- { ar: "أَهْلًا", pos: chunk, rung: easy-1 }

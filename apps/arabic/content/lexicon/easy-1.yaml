# Easy 1 lexicon (CLAUDE.md §5.4, §8.4): words Easy 1 uses that are not in core.yaml or a glossary.
# The greeting chunks are glossed whole in lesson 1; the single words inside them are listed here
# so the lexicon lint can find each word. Fully vowelled. No verbs (greetings are chunks).


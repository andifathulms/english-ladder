# Core lexicon (CLAUDE.md §5.4, §8.4): words a rung may use without a glossary entry.
# Every Arabic word in a lesson (after clitics و ف ب ل ك ال and possessive endings are stripped)
# must be here for its rung or earlier, or in a glossary so far. Fully vowelled.
# pos: noun | adj | verb | particle | pron | chunk | num | name. No verbs before Easy 2.


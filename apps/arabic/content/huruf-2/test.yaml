    type: read
    match: exact
    ar: "السَّمَكُ"
    options: ["al-samaku", "as-samaku", "as-samakun"]
    answer: "as-samaku"
    why: { id: "س huruf syamsiyah: lam melebur, *as-samaku*.", en: "س is a sun letter: the lam merges, *as-samaku*." }
  - id: h2-t-11

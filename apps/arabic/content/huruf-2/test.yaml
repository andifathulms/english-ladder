items:
  - id: h2-t-01
    from: huruf2-01-mad
    type: read
    match: exact
    ar: "صَابُون"
    options: ["ṣābūn", "ṣabun", "sābūn"]
    answer: "ṣābūn"
    why: { id: "Alif dan waw memanjangkan dua vokalnya: *ṣā-būn*, dengan ص tebal.", en: "Alif and waw stretch both vowels: *ṣā-būn*, with a heavy ص." }
  - id: h2-t-02
    from: huruf2-01-mad
    type: mark
    match: exact
    prompt: "Vokal apa di huruf kedua?"
    ar: "كِتَاب"
    target: 1
    options: [fatha, kasra, damma]
    answer: fatha
    why: { id: "Alif panjang selalu didahului fathah: *tā*.", en: "A long alif always follows a fathah: *tā*." }
  - id: h2-t-03
    from: huruf2-02-sukun
    type: read
    match: exact
    ar: "مِلْح"
    options: ["miliḥ", "milḥ", "mīlḥ"]
    answer: "milḥ"
    why: { id: "لْ bersukun: tidak ada vokal di antara *l* dan *ḥ*.", en: "لْ has sukun: no vowel between *l* and *ḥ*." }
  - id: h2-t-04
    from: huruf2-02-sukun
    type: mark
    match: exact
    prompt: "Tanda apa di huruf kedua?"
    ar: "بَحْر"
    target: 1
    options: [sukun, fatha, kasra]
    answer: sukun
    why: { id: "*Baḥr*: ح ditutup tanpa vokal.", en: "*Baḥr*: ح is closed with no vowel." }
  - id: h2-t-05
    from: huruf2-03-syaddah

    from: huruf2-04-tanwin
    type: listen
    match: exact
    audio: "قَلَمٍ"
    options: ["قَلَمٌ", "قَلَمًا", "قَلَمٍ"]
    answer: "قَلَمٍ"
    why: { id: "Kamu mendengar *qalamin*, akhiran *-in*.", en: "You heard *qalamin*, the *-in* ending." }
  - id: h2-t-10

    type: choice
    match: exact
    prompt: "Mana yang huruf qamariyah (lam-nya tetap dibaca)?"
    options: ["ش", "ن", "ب", "د"]
    answer: "ب"
    why: { id: "ب huruf qamariyah: *al-bābu*. ش ن د huruf syamsiyah.", en: "ب is a moon letter: *al-bābu*. ش ن د are sun letters." }
  - id: h2-t-13

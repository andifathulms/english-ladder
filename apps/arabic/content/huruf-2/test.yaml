    type: mark
    match: exact
    prompt: "Tanda apa di huruf kedua?"
    ar: "سُكَّر"
    target: 1
    options: [shadda, sukun, fatha]
    answer: shadda
    why: { id: "*Suk-kar*: ك dobel.", en: "*Suk-kar*: ك is doubled." }
  - id: h2-t-07

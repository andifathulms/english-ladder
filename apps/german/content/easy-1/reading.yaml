rung: easy-1
title: { id: "Rina di Hamburg", en: "Rina in Hamburg", de: "Rina in Hamburg" }
lines:
  - { de: "Hallo! Ich heiße Rina und ich komme aus Indonesien, aus Balikpapan.", id: "Halo! Namaku Rina dan aku dari Indonesia, dari Balikpapan." }
  - { de: "Ich bin dreiundzwanzig Jahre alt.", id: "Umurku dua puluh tiga tahun." }
  - { de: "Jetzt wohne ich in Hamburg.", id: "Sekarang aku tinggal di Hamburg." }
  - { de: "Ich mache hier eine Ausbildung. Ich lerne viel.", id: "Di sini aku ikut Ausbildung. Aku belajar banyak." }
  - { de: "Meine Wohnung ist klein, aber schön.", id: "Apartemenku kecil, tapi bagus." }
  - { de: "Im Zimmer sind ein Bett, ein Tisch und zwei Stühle.", id: "Di kamar ada tempat tidur, meja dan dua kursi." }
  - { de: "Meine Familie wohnt in Balikpapan.", id: "Keluargaku tinggal di Balikpapan." }
  - { de: "Ich habe einen Bruder und zwei Schwestern.", id: "Aku punya satu saudara laki-laki dan dua saudara perempuan." }
  - { de: "Mein Bruder ist Mechaniker, und meine Schwestern sind Studentinnen.", id: "Saudara laki-lakiku montir, dan saudara-saudara perempuanku mahasiswi." }
  - { de: "Heute kochen meine Kollegin Lena und ich zusammen.", id: "Hari ini aku masak bareng Lena, rekan kerjaku." }
  - { de: "Was kostet ein Kilo Reis in Hamburg? Drei Euro!", id: "Sekilo beras di Hamburg harganya berapa? Tiga euro!" }
  - { de: "Und du? Wo wohnst du? Was machst du?", id: "Kalau kamu? Kamu tinggal di mana? Kamu ngapain?" }

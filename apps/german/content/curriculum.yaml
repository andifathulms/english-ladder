# German Ladder curriculum (PRD §4.2). Ten rungs in CEFR half-levels A1.1 → C1, checked against Profile
# Deutsch and the Goethe-Institut word lists, with exits marked at A1, B1 and B2 (and C1). Explanations:
# Indonesian until Medium 1, mixed at Medium 2–3, German with Indonesian notes at Hard.
rungs:
  - id: dasar
    name: Dasar
    subtitle: Bunyi dan ejaan
    tier: dasar
    cefr: Pre-A1
    explain_lang: id
    status: soon
    optional: true
    lessons: 6
    words_target: 30
    description:
      id: "Kata yang sudah kamu kenal dari bahasa Belanda, umlaut ü dan ö, dua bunyi ch, dan ejaan yang bisa ditebak."
      en: "Words you know through Dutch, the umlauts ü and ö, the two ch sounds, and spelling you can predict."
    topics: [kamu sudah tahu, a ä o ö u ü, ei ie eu, ch sch sp st, Tag dibaca Tak, ß dan r, membaca nyaring]
    threads: [sounds]
    inventory: [d-bridges, d-umlauts, d-diphthongs, d-consonants, d-devoicing, d-stress]
  - id: easy-1
    name: Easy 1
    subtitle: Hallo!
    tier: easy
    cefr: A1.1
    explain_lang: id
    status: soon
    lessons: 12
    words_target: 250
    description:
      id: "Menyapa dengan du dan Sie, sein, kata kerja di posisi kedua, der/die/das, angka, haben, jamak dan akusatif."
      en: "Greeting with du and Sie, sein, the verb in second place, der/die/das, numbers, haben, plurals and the accusative."
    topics: [Hallo du Sie, ich heiße, verba di posisi 2, pertanyaan W, der die das, angka, ein kein, haben dan keluarga, jamak, akusatif, möchte dan belanja, letak benda]
    threads: [gender, plural, cases, word-order, register, work]
    inventory: [a1-greetings-register, a1-sein-heissen, a1-present-regular, a1-verb-second, a1-questions, a1-gender-definite, a1-numbers, a1-indefinite-kein, a1-haben-possessives, a1-plural, a1-accusative, a1-moechte-shopping, a1-place-chunks]
  - id: easy-2
    name: Easy 2
    subtitle: Alltag
    tier: easy
    cefr: A1.2
    milestone: { label: "A1 · Goethe", exam: "Goethe-Zertifikat A1 / Start Deutsch 1" }
    explain_lang: id
    status: soon
    lessons: 12
    words_target: 300
    description:
      id: "Jam dan jadwal, kata kerja terpisah, kata kerja modal, datif, Wechselpräpositionen, formulir, dan Perfekt pertama. Selesai di sini: level ujian A1."
      en: "Time and schedules, separable verbs, modal verbs, the dative, two-way prepositions, forms, and a first Perfekt. Finish here: the A1 exam level."
    topics: [um am im, aufstehen, können müssen, mich dich, perintah, mit dem Bus, wo dan wohin, ke dokter, tempat tinggal, formulir, ich habe gearbeitet, satu hari utuh]
    threads: [separable, modals, cases, prepositions, perfekt, work]

# Grammar points (CLAUDE.md §3.4): ids used by curriculum `inventory` and lesson `introduces`.
# Draft data for the teacher's review (docs/german/human-tasks.md H1).
#
# - level: the Profile Deutsch level of the point (Glaboniat et al., Profile deutsch, Langenscheidt;
#   Grammatik inventory), as the reviewer will check it. Where the course teaches a point earlier
#   than its level (as A1 textbooks do), `note` says so.
# - verbs: verbs whose forms the point teaches (the lint allows them from here on).
# - chunks: fixed phrases taught before their grammar (wie geht's, ich möchte, im Supermarkt).
# - detect: what the inventory lint looks for to tell the point is used (course/lint.ts, §4.1):
#   dative, perfekt, subordinate, genitive, konj2, relative, passive, adj-ending.


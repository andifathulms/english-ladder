# Verbs used up to the live rungs (CLAUDE.md §3.4). Draft data for the teacher's review.
#
# - sep: separable prefix (aufstehen → auf); aux + partizip: the Perfekt (participle with its prefix)
# - vowel: present-tense stem-vowel change for du and er/sie/es (a-ä, e-i, e-ie, au-äu)
# - praet: Präteritum stem; `weak: true` takes the weak endings (hatte, konnte, brachte)
# - irregular: cells the rules in lib/de/conjugate.ts don't produce (a list is all six persons:
#   ich, du, er/sie/es, wir, ihr, sie/Sie; a map is some of them)
# - check: reference forms, written out by hand; the library is tested against them. Imperativ lists
#   du, ihr and Sie in the du, ihr and sie cells (ich, er and wir are empty).

# ---------- irregular ----------
- inf: sein
  id: adalah, ada
  aux: sein
  partizip: gewesen
  praet: { stem: war }
  irregular:
    praesens: [bin, bist, ist, sind, seid, sind]
    imperativ: { du: sei, ihr: seid, sie: seien Sie }
    konj2: [wäre, wärst, wäre, wären, wärt, wären]
  check:
    praesens: [bin, bist, ist, sind, seid, sind]
    praeteritum: [war, warst, war, waren, wart, waren]
    perfekt: [bin gewesen, bist gewesen, ist gewesen, sind gewesen, seid gewesen, sind gewesen]
    imperativ: ['', sei, '', '', seid, seien Sie]
    konj2: [wäre, wärst, wäre, wären, wärt, wären]
- inf: haben

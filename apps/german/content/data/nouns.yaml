# Nouns (CLAUDE.md §3.4): gender, plural and plural pattern, all authored; nothing here is computed.
# Draft data for the teacher's review (human-tasks H1).
#
# - plural: null for nouns used without a plural (Reis, Milch); pattern: "- ¨ -e ¨e -er ¨er -n -en
#   -nen -s -se", or `other` (Museum → Museen). ¨ umlauts the last a, o, u or au.
# - person: true for nouns that name people (the -er and -ling clues only count for people).
# - exception: why the noun breaks the ending clue it matches (GenderTiles marks it).
# - parts / links: a compound's parts and the linking element after each part but the last
#   (Arbeit + s + Platz). The compound's gender is the last part's.
# - level: the Goethe-Institut word list the noun appears on, used as a level tag only (vendor/SOURCE.md).


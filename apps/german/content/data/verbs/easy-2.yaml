- inf: untersuchen
  id: memeriksa
  aux: haben
  partizip: untersucht
  # unter- is inseparable here; the weak stem is listed because the regular rule would add ge-.
  praet: { stem: untersucht, weak: true }
  check:
    praesens: [untersuche, untersuchst, untersucht, untersuchen, untersucht, untersuchen]


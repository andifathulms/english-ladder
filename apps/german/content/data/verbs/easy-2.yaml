# Verbs added with Easy 2 (CLAUDE.md §3.4), same shape as verbs.yaml, every present form written out by
# hand in check.praesens (ich, du, er/sie/es, wir, ihr, sie/Sie); check.perfekt for the verbs the Perfekt
# lesson (easy2-11) uses. Strong verbs list their Präteritum stem. Draft data for the teacher's review.

# ---------- time and daily life ----------
- inf: beginnen
  id: mulai
  aux: haben
  partizip: begonnen
  praet: { stem: begann }
  check:
    praesens: [beginne, beginnst, beginnt, beginnen, beginnt, beginnen]
- inf: beten
  id: berdoa; salat
  aux: haben
  partizip: gebetet
  # be- here is part of the stem, not a prefix; the weak stem is listed so the rule doesn't drop ge-.
  praet: { stem: betet, weak: true }
  check:
    praesens: [bete, betest, betet, beten, betet, beten]
- inf: klingeln
  id: berdering; membunyikan bel
  aux: haben
  partizip: geklingelt
  check:
    praesens: [klingle, klingelst, klingelt, klingeln, klingelt, klingeln]
- inf: dauern
  id: berlangsung; makan waktu
  aux: haben
  partizip: gedauert
  check:
    praesens: [dauere, dauerst, dauert, dauern, dauert, dauern]
- inf: feiern
  id: merayakan; berpesta
  aux: haben
  partizip: gefeiert
  check:
    praesens: [feiere, feierst, feiert, feiern, feiert, feiern]
- inf: schicken
  id: mengirim
  aux: haben
  partizip: geschickt
  check:
    praesens: [schicke, schickst, schickt, schicken, schickt, schicken]


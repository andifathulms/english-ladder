# ---------- travel and directions ----------
- inf: abfahren
  id: berangkat (kendaraan)
  sep: ab
  vowel: a-ä
  aux: sein
  partizip: abgefahren
  praet: { stem: fuhr }
  check:
    praesens: [fahre ab, fährst ab, fährt ab, fahren ab, fahrt ab, fahren ab]
- inf: abbiegen
  id: berbelok
  sep: ab
  aux: sein
  partizip: abgebogen
  praet: { stem: bog }
  check:
    praesens: [biege ab, biegst ab, biegt ab, biegen ab, biegt ab, biegen ab]
    imperativ: ['', bieg ab, '', '', biegt ab, biegen Sie ab]
- inf: fliegen
  id: terbang; naik pesawat
  aux: sein
  partizip: geflogen
  praet: { stem: flog }
  check:
    praesens: [fliege, fliegst, fliegt, fliegen, fliegt, fliegen]
    perfekt: [bin geflogen, bist geflogen, ist geflogen, sind geflogen, seid geflogen, sind geflogen]

# ---------- phone, doctor ----------
- inf: zurückrufen
  id: menelepon balik
  sep: zurück
  aux: haben
  partizip: zurückgerufen
  praet: { stem: rief }
  check:
    praesens: [rufe zurück, rufst zurück, ruft zurück, rufen zurück, ruft zurück, rufen zurück]
- inf: mitbringen
  id: membawa (serta)
  sep: mit
  aux: haben
  partizip: mitgebracht
  praet: { stem: bracht, weak: true }
  check:
    praesens: [bringe mit, bringst mit, bringt mit, bringen mit, bringt mit, bringen mit]
    imperativ: ['', bring mit, '', '', bringt mit, bringen Sie mit]
- inf: husten
  id: batuk
  aux: haben
  partizip: gehustet

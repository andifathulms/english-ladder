# Easy 2 rung test (PRD §5.5): draw 16 of 27, pass 12, at least one item from every lesson (two or
# three in the pool). The pool practises the A1 exam's skills — short announcements and phone
# messages, reading a notice or a flat ad, filling in a form, writing a short message — with items
# written from scratch for this course (no exam material). Draft.
rung: easy-2
draw: 16
pass: 12
items:
  # 01 time: um, am, im
  - { id: e2-t-01, from: easy2-01-uhrzeit, type: listen, prompt: "Wann beginnt der Kurs?", audio: "Der Deutschkurs beginnt am Montag um halb neun.", options: ["Der Deutschkurs beginnt am Montag um halb neun.", "Der Deutschkurs beginnt am Mittwoch um halb neun.", "Der Deutschkurs beginnt am Montag um halb zehn."], answer: "Der Deutschkurs beginnt am Montag um halb neun.", why: { id: "*Am Montag* = hari Senin; *halb neun* = 8.30.", en: "*Am Montag* = on Monday; *halb neun* = 8:30." } }
  - { id: e2-t-02, from: easy2-01-uhrzeit, type: gap, cue: "Bulan Desember aku cuti.", prompt: "___ Dezember habe ich Urlaub.", options: [Im, Am, Um], answer: Im, why: { id: "Bulan memakai *im*: *im Dezember*.", en: "Months take *im*: *im Dezember*." } }
  # 02 separable verbs
  - { id: e2-t-03, from: easy2-02-aufstehen, type: wordorder, cue: "Aku belanja hari Sabtu.", tiles: [ein, Ich, am Samstag, kaufe], answer: [Ich, kaufe, am Samstag, ein], zones: [p1, verb, middle, end], why: { id: "*Kaufe* di posisi 2, *ein* di akhir.", en: "*Kaufe* in position 2, *ein* at the end." } }
  - { id: e2-t-04, from: easy2-02-aufstehen, type: listen, prompt: "Was soll Rina machen?", audio: "Hallo Rina, hier ist Lena. Bitte ruf mich heute Abend an!", options: ["Lena anrufen.", "Lena abholen.", "Lena besuchen."], answer: "Lena anrufen.", why: { id: "*Ruf mich an* = telepon aku.", en: "*Ruf mich an* = call me." } }
  # 03 modal verbs
  - { id: e2-t-05, from: easy2-03-koennen, type: gap, cue: "Di sini nggak boleh merokok.", prompt: "Hier ___ man nicht rauchen.", options: [darf, darfst, dürfen], answer: darf, why: { id: "*Man* + bentuk *er*: *darf*.", en: "*Man* + the *er* form: *darf*." } }
  - { id: e2-t-06, from: easy2-03-koennen, type: fix, wrong: "Ich muss arbeite heute.", options: ["Ich muss heute arbeiten.", "Ich muss heute arbeite."], answer: "Ich muss heute arbeiten.", why: { id: "Setelah modal: bentuk dasar di akhir, *arbeiten*.", en: "After a modal: the base form at the end, *arbeiten*." } }
  # 04 object pronouns
  - { id: e2-t-07, from: easy2-04-mich-dich, type: gap, cue: "Filmnya bagus. Aku nonton (film itu) malam ini.", prompt: "Der Film ist gut. Ich sehe ___ heute Abend.", options: [ihn, es, sie], answer: ihn, why: { id: "*Der Film* → *ihn*.", en: "*Der Film* → *ihn*." } }
  - { id: e2-t-08, from: easy2-04-mich-dich, type: gap, prompt: "Kannst du ___ am Bahnhof abholen?", options: [mich, mir, ich], answer: mich, why: { id: "Objek dari *abholen*: *mich*.", en: "The object of *abholen*: *mich*." } }
  # 05 imperative
  - { id: e2-t-09, from: easy2-05-imperativ, type: form, cue: "Silakan duduk.", base: nehmen, target: { person: sie, tense: imperativ }, frame: "Bitte ___ Platz.", options: [nehmen Sie, Sie nehmen, nimm], answer: nehmen Sie, why: { id: "Perintah sopan: *nehmen Sie*. *Platz nehmen* = duduk.", en: "A polite instruction: *nehmen Sie*. *Platz nehmen* = to take a seat." } }
  - { id: e2-t-10, from: easy2-05-imperativ, type: choice, prompt: "Was müssen Sie machen? Schild in der Klinik: „Bitte Hände waschen!“", options: ["Die Hände waschen.", "Die Handtücher waschen.", "Hier warten."], answer: "Die Hände waschen.", why: { id: "Papan petunjuk sering memakai bentuk dasar: *Hände waschen* = cuci tangan.", en: "Signs often use the base form: *Hände waschen* = wash your hands." } }
  # 06 dative prepositions
  - { id: e2-t-11, from: easy2-06-mit-dem-bus, type: case, cue: "Aku naik sepeda ke tempat kerja.", sentence: "Ich fahre mit ___ Fahrrad zur Arbeit.", role: dat, noun: Fahrrad, options: [dem, das, der], answer: dem, why: { id: "*Mit* + datif: *das Fahrrad* → *mit dem Fahrrad*.", en: "*Mit* + dative: *das Fahrrad* → *mit dem Fahrrad*." } }
  - { id: e2-t-12, from: easy2-06-mit-dem-bus, type: gap, cue: "Aku ke apotek.", prompt: "Ich gehe ___ Apotheke.", options: [zur, zum, zu], answer: zur, why: { id: "*Die Apotheke* → *zu der* → *zur*.", en: "*Die Apotheke* → *zu der* → *zur*." } }
  # 07 wo? / wohin?, directions
  - { id: e2-t-13, from: easy2-07-wo-wohin, type: wechsel, cue: "Aku taruh susunya ke dalam kulkas.", scene: { place: in, motion: true }, sentence: "Ich stelle die Milch in ___ Kühlschrank.", verb: stellen, options: [den, dem], answer: den, why: { id: "*Wohin?* Akusatif: *in den Kühlschrank*.", en: "*Wohin?* Accusative: *in den Kühlschrank*." } }
  - { id: e2-t-14, from: easy2-07-wo-wohin, type: listen, prompt: "Wo ist die Post?", audio: "Die Post? Gehen Sie hier geradeaus und dann rechts. Sie ist neben der Bank.", options: ["Rechts, neben der Bank.", "Links, neben der Bank.", "Geradeaus, neben dem Kino."], answer: "Rechts, neben der Bank.", why: { id: "*Geradeaus und dann rechts*, *neben der Bank*.", en: "*Geradeaus und dann rechts*, *neben der Bank*." } }
  # 08 the doctor
  - { id: e2-t-15, from: easy2-08-arzt, type: listen, prompt: "Wann ist der Termin?", audio: "Guten Tag, hier ist die Praxis Wagner. Ihr Termin ist am Freitag um Viertel nach zehn.", options: ["Am Freitag um 10:15 Uhr.", "Am Freitag um 9:45 Uhr.", "Am Donnerstag um 10:15 Uhr."], answer: "Am Freitag um 10:15 Uhr.", why: { id: "*Viertel nach zehn* = 10.15; *Freitag* = Jumat.", en: "*Viertel nach zehn* = 10:15; *Freitag* = Friday." } }
  - { id: e2-t-16, from: easy2-08-arzt, type: gap, cue: "Punggungku sakit.", prompt: "Mein Rücken ___ weh.", options: [tut, tun, hat], answer: tut, why: { id: "*Mein Rücken* = *er*: *tut weh*.", en: "*Mein Rücken* = *er*: *tut weh*." } }
  # 09 housing: the flat ad
  - { id: e2-t-17, from: easy2-09-wohnung, type: choice, prompt: "Wie viele Zimmer hat die Wohnung? Anzeige: „Wohnung in Köln: 3 Zimmer, Küche, Bad, Balkon, 75 Quadratmeter, 890 Euro warm. Ab 1. Mai frei.“", options: ["Drei.", "Zwei.", "Vier."], answer: "Drei.", why: { id: "*3 Zimmer* = tiga kamar.", en: "*3 Zimmer* = three rooms." } }
  - { id: e2-t-18, from: easy2-09-wohnung, type: choice, prompt: "Ab wann ist die Wohnung frei? Anzeige: „Wohnung in Köln: 3 Zimmer, Küche, Bad, Balkon, 75 Quadratmeter, 890 Euro warm. Ab 1. Mai frei.“", options: ["Ab 1. Mai.", "Ab 1. März.", "Ab sofort."], answer: "Ab 1. Mai.", why: { id: "*Ab 1. Mai frei* = kosong mulai 1 Mei.", en: "*Ab 1. Mai frei* = free from 1 May." } }
  # 10 forms
  - { id: e2-t-19, from: easy2-10-formular, type: choice, cue: "Kamu lahir di Surabaya. Apa yang kamu tulis?", prompt: "Formular: Geburtsort: ___", options: ["Surabaya", "Indonesien", "15.08.2001"], answer: "Surabaya", why: { id: "*Geburtsort* = tempat lahir (kota).", en: "*Geburtsort* = place of birth (the town)." } }
  - { id: e2-t-20, from: easy2-10-formular, type: dictation, audio: "Mein Nachname ist Wijaya.", answer: "Mein Nachname ist Wijaya.", why: { id: "*Nachname* = nama keluarga, kata benda dengan huruf besar.", en: "*Nachname* = surname, a noun with a capital." } }
  - { id: e2-t-21, from: easy2-10-formular, type: gap, cue: "Silakan tanda tangan di sini.", prompt: "Bitte ___ Sie hier.", options: [unterschreiben, unterschreibt, unterschreibe], answer: unterschreiben, why: { id: "Perintah dengan *Sie*: *unterschreiben Sie*.", en: "A command with *Sie*: *unterschreiben Sie*." } }
  # 11 Perfekt, war, hatte
  - { id: e2-t-22, from: easy2-11-perfekt, type: gap, cue: "Akhir pekan aku ke Hamburg.", prompt: "Am Wochenende ___ ich nach Hamburg gefahren.", options: [bin, habe], answer: bin, why: { id: "*Fahren* memakai *sein*: *ich bin gefahren*.", en: "*Fahren* takes *sein*: *ich bin gefahren*." } }
  - { id: e2-t-23, from: easy2-11-perfekt, type: form, cue: "Kami (sudah) masak.", base: kochen, target: { person: wir, tense: perfekt }, frame: "Wir ___.", answer: haben gekocht, why: { id: "*Haben* + *gekocht* (*ge- + koch + -t*).", en: "*Haben* + *gekocht* (*ge- + koch + -t*)." } }
  - { id: e2-t-24, from: easy2-11-perfekt, type: gap, prompt: "Ich ___ gestern krank.", options: [war, hatte, bin], answer: war, why: { id: "Lampau dari *ich bin*: *ich war*.", en: "The past of *ich bin*: *ich war*." } }
  # 12 a whole day: a short message, an announcement
  - { id: e2-t-25, from: easy2-12-ein-tag, type: wordorder, cue: "Pesan ke Lena: hari ini aku nggak bisa datang.", tiles: [kommen, Ich, heute, nicht, kann], answer: [Ich, kann, heute, nicht, kommen], zones: [p1, verb, middle, middle, end], why: { id: "*Kann* di posisi 2, *kommen* di akhir.", en: "*Kann* in position 2, *kommen* at the end." } }
  - { id: e2-t-26, from: easy2-12-ein-tag, type: choice, cue: "Kamu menulis pesan kepada Jonas.", prompt: "Wie beginnt die Nachricht?", options: ["Lieber Jonas,", "Liebe Jonas,", "Viele Grüße, Jonas"], answer: "Lieber Jonas,", why: { id: "Untuk laki-laki: *Lieber Jonas*; untuk perempuan: *Liebe Lena*. *Viele Grüße* untuk penutup.", en: "For a man: *Lieber Jonas*; for a woman: *Liebe Lena*. *Viele Grüße* closes the message." } }
  - { id: e2-t-27, from: easy2-12-ein-tag, type: listen, prompt: "Was ist mit dem Zug?", audio: "Achtung: Der Zug nach Berlin hat zehn Minuten Verspätung.", options: ["Er kommt zehn Minuten später.", "Er fährt heute nicht.", "Er fährt von Gleis zehn ab."], answer: "Er kommt zehn Minuten später.", why: { id: "*Verspätung* = keterlambatan: keretanya telat sepuluh menit.", en: "*Verspätung* = delay: the train is ten minutes late." } }

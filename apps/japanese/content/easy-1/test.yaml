  - { id: e1-t-26, from: easy1-09-wo-de, type: gap, cue: "Saya minum air.", prompt: "{水|みず} ___ {飲|の}みます 。", options: [を, で, に], answer: を, why: { id: "Objek: を.", en: "The object: を." } }
  # 10 · ました

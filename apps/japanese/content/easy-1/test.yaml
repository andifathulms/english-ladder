  - { id: e1-t-17, from: easy1-06-nanji, type: listen, audio: "{今|いま} {午後|ご|ご} {二時|に|じ} です 。", options: ["Sekarang jam dua siang.", "Sekarang jam dua pagi.", "Sekarang jam dua belas."], answer: "Sekarang jam dua siang.", why: { id: "ごご: siang/sore. ごぜん: pagi.", en: "ごご: p.m. ごぜん: a.m." } }
  - { id: e1-t-18, from: easy1-06-nanji, type: kana, ja: "{今|いま}", furigana: false, answer: いま, why: { id: "今: いま, sekarang.", en: "今: いま, now." } }
  # 7 · ます, verb last
  - { id: e1-t-19, from: easy1-07-masu, type: order, cue: "Saya membaca buku.", tiles: ["{読|よ}みます", を, わたし, "{本|ほん}", は], answer: [わたし, は, "{本|ほん}", を, "{読|よ}みます"], why: { id: "Kata kerja selalu di akhir.", en: "The verb always goes last." } }
  - { id: e1-t-20, from: easy1-07-masu, type: form, word: "{食|た}べます", target: masen, options: ["{食|た}べません", "{食|た}べないです", "{食|た}べました"], answer: "{食|た}べません", why: { id: "Tidak: ます jadi ません.", en: "Not: ます becomes ません." } }
  - { id: e1-t-21, from: easy1-07-masu, type: choice, prompt: "シティ さん は コーヒー を {飲|の}みません 。", options: [Siti tidak minum kopi., Siti minum kopi., Siti membeli kopi.], answer: Siti tidak minum kopi., why: { id: "ません: tidak.", en: "ません: not." } }
  # 8 · へ / に

  - { id: e1-t-32, from: easy1-12-na-adj, type: fix, wrong: "リナ さん は {元気|げん|き} な です 。", options: ["リナ さん は {元気|げん|き} です 。", "リナ さん は {元気|げん|き} い です 。"], answer: "リナ さん は {元気|げん|き} です 。", why: { id: "Sebelum です tidak ada な.", en: "No な before です." } }

  - { id: e1-t-15, from: easy1-05-ikura, type: kana, ja: "{九十円|きゅう|じゅう|えん}", furigana: false, answer: きゅうじゅうえん, why: { id: "九十円: きゅうじゅうえん, 90 yen.", en: "九十円: きゅうじゅうえん, 90 yen." } }
  # 6 · time

  # 1 · X は Y です
  - { id: e1-t-01, from: easy1-01-hajimemashite, type: gap, cue: "Saya pelajar.", prompt: "わたし ___ {学生|がく|せい} です 。", options: [は, を, か], answer: は, why: { id: "は menandai topik: わたし.", en: "は marks the topic: わたし." } }
  - { id: e1-t-02, from: easy1-01-hajimemashite, type: order, cue: "Pak Tanaka guru.", tiles: [です, "{田中|た|なか}", "{先生|せん|せい}", さん, は], answer: ["{田中|た|なか}", さん, は, "{先生|せん|せい}", です], why: { id: "です selalu di akhir.", en: "です always goes last." } }
  - { id: e1-t-03, from: easy1-01-hajimemashite, type: kana, ja: "{先生|せん|せい}", furigana: false, answer: せんせい, why: { id: "先生 dibaca せんせい: guru.", en: "先生 is read せんせい: teacher." } }
  # 2 · か and の
  - { id: e1-t-04, from: easy1-02-ka-no, type: gap, cue: "Apakah Budi pelajar?", prompt: "ブディ さん は {学生|がく|せい} です ___ 。", options: [か, の, は], answer: か, why: { id: "か di akhir menjadikan kalimat pertanyaan.", en: "か at the end makes a question." } }
  - { id: e1-t-05, from: easy1-02-ka-no, type: fix, wrong: "{名前|な|まえ} の わたし は リナ です 。", options: ["わたし の {名前|な|まえ} は リナ です 。", "わたし は {名前|な|まえ} の リナ です 。"], answer: "わたし の {名前|な|まえ} は リナ です 。", why: { id: "Pemilik dulu: わたし の 名前.", en: "The owner first: わたし の 名前." } }
  - { id: e1-t-06, from: easy1-02-ka-no, type: choice, prompt: "お{名前|な|まえ} は {何|なん} です か 。", options: [Namanya siapa?, Kamu dari mana?, Kamu pelajar?], answer: Namanya siapa?, why: { id: "お名前 は 何 です か: menanyakan nama.", en: "お名前 は 何 です か asks for a name." } }
  # 3 · これ / それ / あれ
  - { id: e1-t-07, from: easy1-03-kore-sore-are, type: gap, cue: "Itu apa? (dekat lawan bicaramu)", prompt: "___ は {何|なん} です か 。", options: [それ, これ, あの], answer: それ, why: { id: "Dekat lawan bicara: それ.", en: "Near the listener: それ." } }
  - { id: e1-t-08, from: easy1-03-kore-sore-are, type: gap, cue: "Buku ini buku bahasa Jepang.", prompt: "___ {本|ほん} は {日本語|に|ほん|ご} の {本|ほん} です 。", options: [この, これ, ここ], answer: この, why: { id: "Sebelum kata benda: この.", en: "Before a noun: この." } }
  - { id: e1-t-09, from: easy1-03-kore-sore-are, type: kana, ja: "{電話|でん|わ}", furigana: false, answer: でんわ, why: { id: "電話 dibaca でんわ: telepon.", en: "電話 is read でんわ: telephone." } }
  # 4 · ここ / そこ / あそこ
  - { id: e1-t-10, from: easy1-04-koko-soko, type: choice, prompt: "トイレ は どこ です か 。", options: [Toiletnya di mana?, Ini toilet?, Toiletnya di sana.], answer: Toiletnya di mana?, why: { id: "どこ: di mana.", en: "どこ: where." } }
  - { id: e1-t-11, from: easy1-04-koko-soko, type: fix, wrong: "{出口|で|ぐち} は あそこ に です 。", options: ["{出口|で|ぐち} は あそこ です 。", "{出口|で|ぐち} に あそこ です 。"], answer: "{出口|で|ぐち} は あそこ です 。", why: { id: "あそこ sudah berarti *di sana*: tanpa partikel sebelum です.", en: "あそこ already means *over there*: no particle before です." } }
  - { id: e1-t-12, from: easy1-04-koko-soko, type: choice, prompt: "出口", furigana: false, options: [pintu keluar, pintu masuk, toilet], answer: pintu keluar, why: { id: "出口 (でぐち): pintu keluar. 入口 (いりぐち): pintu masuk.", en: "出口 (でぐち): exit. 入口 (いりぐち): entrance." } }
  # 5 · numbers and prices

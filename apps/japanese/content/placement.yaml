  # ---------- long vowels and っ by ear (3) ----------
  - { id: pl-14, section: ear, from: kana1-09-panjang-dan-tsu, type: mora, audio: "おばあさん", ask: spelling, options: [おばさん, おばあさん], answer: おばあさん, why: { id: "あ panjang: おばあさん, nenek.", en: "A long a: おばあさん, grandmother." } }
  - { id: pl-15, section: ear, from: kana1-09-panjang-dan-tsu, type: mora, audio: "きって", ask: spelling, options: [きて, きって], answer: きって, why: { id: "Ada jeda sebelum て: きって, perangko.", en: "A pause before て: きって, stamp." } }
  - { id: pl-16, section: ear, from: kana1-08-kana-kecil, type: mora, audio: "びょういん", ask: spelling, options: [びょういん, びよういん], answer: びょういん, why: { id: "ょ kecil: びょういん, rumah sakit.", en: "A small ょ: びょういん, hospital." } }
  # ---------- typing a heard word (2) ----------
  - { id: pl-17, section: typing, from: kana1-09-panjang-dan-tsu, type: kana, audio: "がっこう", answer: がっこう, why: { id: "がっこう: ketik *gakkou*.", en: "がっこう: type *gakkou*." } }
  - { id: pl-18, section: typing, from: kana2-05-tanda-panjang, type: kana, audio: "コーヒー", answer: コーヒー, script: katakana, why: { id: "コーヒー: ketik *ko-hi-*.", en: "コーヒー: type *ko-hi-*." } }
  # ---------- two basic kanji (2) ----------
  - { id: pl-19, section: kanji, from: kana2-10-kanji-pertama, type: choice, prompt: "山", furigana: false, options: [gunung, sungai, orang], answer: gunung, why: { id: "山 (やま): gunung.", en: "山 (やま): mountain." } }
  - { id: pl-20, section: kanji, from: kana2-10-kanji-pertama, type: choice, prompt: "人", furigana: false, options: [orang, mulut, buku], answer: orang, why: { id: "人 (ひと): orang.", en: "人 (ひと): person." } }

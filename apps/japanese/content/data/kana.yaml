# Kana (CLAUDE.md §5.4) for KanaChart, KanaOrigins and the lessons. One entry per mora, with both
# scripts side by side (the chart and the origins switch between them). Romaji is never authored:
# lib/ja/romaji.ts generates it. Row and column ids name the gojūon grid; they are ids, not readings.
#
#   origin: the kanji each kana came from (hiragana: a cursive whole; katakana: a part of it).
#           Standard textbook attributions; ン has no agreed source, so it has none.
#   note:   irregular  read differently from its row (し ち つ ふ, じ): the chart says how
#           particle   を: today only the object particle, read like お
#           same-as:X  ぢ づ: read like じ ず, and rare
#   lesson: the Kana 1 / Kana 2 lesson that teaches it (the chart dims the rest when asked).
#
# Draft data: the teacher checks it with the lessons (docs/japanese/human-tasks.md H1).

